<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GNSS-Denied Nav — Ground Station</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0b0f14; --panel: #121821; --panel2: #18202b; --line: #243042; --text: #d8e1ec; --muted: #7f8ea3;
    --ok: #2ecc71; --bad: #ff4d4f; --warn: #f5a623; --accent: #4da3ff; --pnp: #ffd84d; --ekf: #ff6b6b; --truth: #ffffff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.4 "Segoe UI", system-ui, sans-serif; }
  header { display: flex; align-items: center; gap: 14px; padding: 8px 14px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header h1 { font-size: 15px; margin: 0 8px 0 0; letter-spacing: .5px; }
  select, button, input[type=range] { background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 4px; padding: 4px 8px; font: inherit; }
  button { cursor: pointer; }
  button.on { border-color: var(--accent); color: var(--accent); }
  .chip { padding: 3px 10px; border-radius: 12px; font-weight: 600; font-size: 12px; border: 1px solid var(--line); }
  .chip.ok { color: var(--ok); border-color: var(--ok); } .chip.bad { color: var(--bad); border-color: var(--bad); animation: blink 1.2s infinite; }
  .chip.warn { color: var(--warn); border-color: var(--warn); } .chip.info { color: var(--accent); border-color: var(--accent); }
  @keyframes blink { 50% { opacity: .45; } }
  .stats { display: flex; gap: 16px; margin-left: auto; flex-wrap: wrap; }
  .stat { text-align: right; } .stat b { display: block; font-size: 16px; font-variant-numeric: tabular-nums; } .stat span { color: var(--muted); font-size: 11px; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); grid-template-rows: minmax(0, 1fr) 210px; gap: 10px; padding: 10px; height: calc(100vh - 92px); }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; position: relative; overflow: hidden; display: flex; flex-direction: column; }
  .panel h2 { margin: 0; padding: 6px 10px; font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .6px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; }
  #camwrap { flex: 1; display: flex; align-items: center; justify-content: center; background: #000; min-height: 0; }
  #cam { max-width: 100%; max-height: 100%; }
  #map { flex: 1; background: #05080c; }
  #chartbox { grid-column: 1 / 3; }
  #chartwrap { flex: 1; padding: 4px 10px; min-height: 0; }
  footer { display: flex; align-items: center; gap: 10px; padding: 6px 14px; background: var(--panel); border-top: 1px solid var(--line); height: 40px; }
  footer input[type=range] { flex: 1; }
  .legend { display: flex; gap: 12px; font-size: 11px; color: var(--muted); }
  .legend i { display: inline-block; width: 18px; height: 3px; vertical-align: middle; margin-right: 4px; }
  .camtag { position: absolute; left: 10px; top: 36px; background: rgba(0,0,0,.6); padding: 4px 8px; border-radius: 4px; font-size: 12px; }
  .empty { color: var(--muted); padding: 30px; text-align: center; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; grid-template-rows: 300px 360px 200px; height: auto; } #chartbox { grid-column: 1; } }
</style>
</head>
<body>
<header>
  <h1>GNSS-DENIED NAV · GROUND STATION</h1>
  <select id="run"></select>
  <button id="live" title="follow a running flight">● LIVE</button>
  <button id="follow" class="on" title="keep the map centred on the aircraft">⌖ FOLLOW</button>
  <span id="gnss" class="chip">GNSS —</span>
  <span id="mode" class="chip">MODE —</span>
  <div class="stats">
    <div class="stat"><b id="s_ekf">—</b><span>autopilot pos. error</span></div>
    <div class="stat"><b id="s_fix">—</b><span>visual fix error</span></div>
    <div class="stat"><b id="s_rate">—</b><span>visual fixes / s</span></div>
    <div class="stat"><b id="s_lat">—</b><span>latency</span></div>
    <div class="stat"><b id="s_alt">—</b><span>alt / heading</span></div>
    <div class="stat"><b id="s_det">—</b><span>targets in view</span></div>
  </div>
</header>
<main>
  <section class="panel">
    <h2>Onboard nadir camera <span id="camtime"></span></h2>
    <div id="camwrap"><canvas id="cam" width="640" height="427"></canvas></div>
    <div class="camtag" id="camtag"></div>
  </section>
  <section class="panel">
    <h2>Operation area (satellite map) <span class="legend">
      <span><i style="background:var(--truth)"></i>true</span>
      <span><i style="background:var(--ekf)"></i>autopilot</span>
      <span><i style="background:var(--ok)"></i>visual fixes</span>
      <span><i style="background:var(--pnp)"></i>target (visual pose)</span>
      <span><i style="background:#29c3ff"></i>true vehicles</span></span></h2>
    <div id="map"></div>
  </section>
  <section class="panel" id="chartbox">
    <h2>Position error over time <span id="jaminfo"></span></h2>
    <div id="chartwrap"><canvas id="chart"></canvas></div>
  </section>
</main>
<footer>
  <button id="play">▶</button>
  <select id="speed"><option>1</option><option selected>4</option><option>16</option><option>64</option></select><span style="color:var(--muted)">×</span>
  <input type="range" id="slider" min="0" max="0" value="0">
  <span id="clock" style="font-variant-numeric: tabular-nums; min-width: 130px; text-align:right">—</span>
</footer>
<script>
const $ = id => document.getElementById(id);
let RUN = null, INFO = null, rows = [], next = 0, idx = 0, playing = false, live = false, follow = true, lastTick = 0, simT = 0;
let map, layers = {}, chart, camImg = new Image(), camName = null, jamT = null;

const fmtM = v => v == null ? "—" : (v >= 1000 ? (v / 1000).toFixed(2) + " km" : v.toFixed(1) + " m");

async function api(path) { const r = await fetch(path); if (!r.ok) throw new Error(path); return r.json(); }

async function loadRuns() {
  const runs = await api("/api/runs");
  $("run").innerHTML = runs.map(r => `<option>${r.tag}</option>`).join("");
  if (runs.length) await openRun(runs[0].tag);
  else document.querySelector("main").innerHTML = '<div class="empty">No runs with telemetry yet. Start one with sim/run_experiment.sh … --frame-every 3</div>';
}

async function openRun(tag) {
  RUN = tag; rows = []; next = 0; idx = 0; jamT = null; camName = null;
  INFO = await api(`/api/run/${tag}/info`);
  initMap(); initChart();
  await pull();
  idx = live ? rows.length - 1 : 0;
  render(true);
}

async function pull() {
  const d = await api(`/api/run/${RUN}/telemetry?start=${next}`);
  if (!d.rows.length) return false;
  for (const r of d.rows) {
    rows.push(r);
    if (jamT === null && r.jammed) jamT = r.t;
  }
  next = d.next;
  $("slider").max = rows.length - 1;
  rebuildChart();
  return true;
}

function initMap() {
  if (map) map.remove();
  map = L.map("map", { zoomSnap: 0.25, preferCanvas: true, attributionControl: false });
  L.imageOverlay(INFO.map_url, INFO.bounds).addTo(map);
  map.fitBounds(INFO.bounds);
  const R = L.canvas();
  layers.vehicles = L.layerGroup(INFO.targets.map(t => L.circleMarker([t[0], t[1]],
      { renderer: R, radius: 2, color: "#29c3ff", weight: 0, fillOpacity: .45 }))).addTo(map);
  layers.truth = L.polyline([], { color: "#fff", weight: 2 }).addTo(map);
  layers.ekf = L.polyline([], { color: "#ff6b6b", weight: 2, dashArray: "5 4" }).addTo(map);
  layers.fixes = L.layerGroup().addTo(map);
  layers.targets = L.layerGroup().addTo(map);
  layers.err = L.polyline([], { color: "#ff6b6b", weight: 1 }).addTo(map);
  layers.acTrue = L.circleMarker([0, 0], { radius: 6, color: "#fff", fillColor: "#fff", fillOpacity: 1 }).addTo(map);
  layers.acEkf = L.circleMarker([0, 0], { radius: 6, color: "#ff6b6b", fillColor: "#ff6b6b", fillOpacity: .4 }).addTo(map);
}

function initChart() {
  if (chart) chart.destroy();
  chart = new Chart($("chart"), {
    type: "line",
    data: { datasets: [
      { label: "autopilot position error (m)", data: [], borderColor: "#ff6b6b", borderWidth: 1.4, pointRadius: 0 },
      { label: "visual fix error (m)", data: [], borderColor: "#2ecc71", borderWidth: 1, pointRadius: 0, showLine: false, pointStyle: "circle" },
    ]},
    options: {
      animation: false, maintainAspectRatio: false, parsing: false, normalized: true,
      scales: { x: { type: "linear", title: { display: true, text: "time (s)" }, ticks: { color: "#7f8ea3" }, grid: { color: "#1c2533" } },
                y: { type: "logarithmic", min: 0.5, title: { display: true, text: "m (log)" }, ticks: { color: "#7f8ea3" }, grid: { color: "#1c2533" } } },
      plugins: { legend: { labels: { color: "#d8e1ec" } } },
    },
    plugins: [{ id: "markers", afterDatasetsDraw(c) {
      const { ctx, chartArea: a, scales: { x } } = c;
      const vline = (t, color, label) => { if (t == null) return; const px = x.getPixelForValue(t);
        ctx.save(); ctx.strokeStyle = color; ctx.setLineDash([4, 3]); ctx.beginPath(); ctx.moveTo(px, a.top); ctx.lineTo(px, a.bottom); ctx.stroke();
        if (label) { ctx.fillStyle = color; ctx.fillText(label, px + 4, a.top + 12); } ctx.restore(); };
      vline(jamT, "#ff4d4f", "GNSS jammed");
      if (rows[idx]) vline(rows[idx].t, "#4da3ff", "");
    }}],
  });
}

function rebuildChart() {
  if (!chart) return;
  const step = Math.max(1, Math.floor(rows.length / 3000));
  const e = [], f = [];
  for (let i = 0; i < rows.length; i += step) {
    const r = rows[i];
    if (r.ekf_err != null) e.push({ x: r.t, y: Math.max(r.ekf_err, 0.5) });
    if (r.fix_err != null && r.sent) f.push({ x: r.t, y: Math.max(r.fix_err, 0.5) });
  }
  chart.data.datasets[0].data = e; chart.data.datasets[1].data = f;
  $("jaminfo").textContent = jamT == null ? "" : `GNSS jammed at t = ${jamT.toFixed(0)} s`;
}

function render(full) {
  const r = rows[idx]; if (!r) return;
  $("slider").value = idx;
  const tj = jamT == null ? null : r.t - jamT;
  $("clock").textContent = `t = ${r.t.toFixed(1)} s` + (tj != null && tj >= 0 ? `  (+${tj.toFixed(0)} s jammed)` : "");
  $("gnss").className = "chip " + (r.jammed ? "bad" : "ok"); $("gnss").textContent = r.jammed ? "GNSS JAMMED" : "GNSS OK";
  const m = r.mode || "—";
  $("mode").className = "chip " + ({ track: "info", global: "warn", tilted: "warn", climb: "" }[m] ?? "");
  $("mode").textContent = { track: "VISUAL TRACKING", global: "RELOCALIZING", tilted: "BANKED · NO FIX", climb: "CLIMB" }[m] || m.toUpperCase();
  $("s_ekf").textContent = fmtM(r.ekf_err);
  $("s_ekf").style.color = r.ekf_err > 50 ? "var(--bad)" : r.ekf_err > 20 ? "var(--warn)" : "var(--ok)";
  $("s_fix").textContent = r.sent ? fmtM(r.fix_err) : "—";
  $("s_lat").textContent = r.latency != null ? (r.latency * 1000).toFixed(0) + " ms" : "—";
  $("s_alt").textContent = `${(r.alt ?? 0).toFixed(0)} m · ${(((r.yaw ?? 0) + 360) % 360).toFixed(0)}°`;
  $("s_det").textContent = (r.dets || []).length;
  // fixes per second over the last 10 s
  let n = 0, j = idx; while (j >= 0 && rows[j].t > r.t - 10) { n += rows[j].sent ? 1 : 0; j--; }
  $("s_rate").textContent = (n / 10).toFixed(1);

  // map: tracks up to now (decimated), aircraft, error line
  const step = Math.max(1, Math.floor(idx / 1500));
  const tr = [], ek = [];
  for (let i = 0; i <= idx; i += step) { tr.push(rows[i].true); ek.push(rows[i].ekf); }
  tr.push(r.true); ek.push(r.ekf);
  layers.truth.setLatLngs(tr); layers.ekf.setLatLngs(ek);
  layers.acTrue.setLatLng(r.true); layers.acEkf.setLatLng(r.ekf); layers.err.setLatLngs([r.true, r.ekf]);
  layers.fixes.clearLayers();
  for (let i = Math.max(0, idx - 400); i <= idx; i++) {
    const q = rows[i]; if (q.sent && q.fix) L.circleMarker(q.fix, { radius: 2, color: "#2ecc71", weight: 0, fillOpacity: .9 }).addTo(layers.fixes);
  }
  layers.targets.clearLayers();
  for (let i = Math.max(0, idx - 60); i <= idx; i++) {
    for (const d of rows[i].dets || []) {
      if (d.pnp) L.circleMarker(d.pnp, { radius: 3, color: "#ffd84d", weight: 1.5, fill: false, opacity: i === idx ? 1 : .35 }).addTo(layers.targets);
      if (i === idx && d.ekf) L.circleMarker(d.ekf, { radius: 3, color: "#ff6b6b", weight: 1.5, fill: false }).addTo(layers.targets);
    }
  }
  if (follow) map.setView(r.true, Math.max(map.getZoom(), 16), { animate: false });

  // camera: latest saved frame at or before idx, boxes from the same row
  let k = idx; while (k >= 0 && !rows[k].frame) k--;
  if (k >= 0 && rows[k].frame !== camName) {
    camName = rows[k].frame;
    const row = rows[k];
    camImg.onload = () => drawCam(row);
    camImg.src = `/api/run/${RUN}/frame/${camName}`;
  } else if (k < 0) {
    const c = $("cam").getContext("2d"); c.fillStyle = "#000"; c.fillRect(0, 0, 640, 427);
  }
  chart.update("none");
}

function drawCam(row) {
  const cv = $("cam"), c = cv.getContext("2d");
  c.drawImage(camImg, 0, 0, cv.width, cv.height);
  const s = cv.width / (INFO.camera.width || 1280);
  for (const d of row.dets || []) {
    c.strokeStyle = d.cls === 1 ? "#ff9f43" : "#ffd84d"; c.lineWidth = 2;
    c.strokeRect((d.u - d.w / 2) * s - 3, (d.v - d.h / 2) * s - 3, d.w * s + 6, d.h * s + 6);
  }
  $("camtime").textContent = `t = ${row.t.toFixed(1)} s`;
  $("camtag").innerHTML = `${(row.dets || []).length} vehicles detected · ${row.inliers ?? 0} map matches` +
    (row.gate ? ` · gate: ${row.gate}` : "");
}

function tick(ts) {
  if (playing && rows.length) {
    const dt = (ts - lastTick) / 1000 * parseFloat($("speed").value);
    simT = (rows[idx]?.t ?? 0) + dt;
    while (idx < rows.length - 1 && rows[idx + 1].t <= simT) idx++;
    if (idx >= rows.length - 1 && !live) { playing = false; $("play").textContent = "▶"; }
    render();
  }
  lastTick = ts;
  requestAnimationFrame(tick);
}

setInterval(async () => {
  if (!live || !RUN) return;
  if (await pull()) { idx = rows.length - 1; render(); }
}, 1000);

$("run").onchange = e => openRun(e.target.value);
$("play").onclick = () => { playing = !playing; $("play").textContent = playing ? "❚❚" : "▶"; if (idx >= rows.length - 1) idx = 0; };
$("slider").oninput = e => { idx = +e.target.value; playing = false; $("play").textContent = "▶"; render(); };
$("follow").onclick = () => { follow = !follow; $("follow").classList.toggle("on", follow); if (!follow) map.fitBounds(INFO.bounds); else render(); };
$("live").onclick = () => { live = !live; $("live").classList.toggle("on", live); if (live) { idx = rows.length - 1; render(); } };
requestAnimationFrame(tick);
loadRuns();
</script>
</body>
</html>
